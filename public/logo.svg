<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5d6d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d4f5f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ice Cube Body - 3D isometric style -->
  <g stroke="#3d4f5f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top face of cube -->
    <path d="M50 8 L82 24 L50 40 L18 24 Z" />

    <!-- Left face of cube -->
    <path d="M18 24 L18 60 L50 76 L50 40 Z" />

    <!-- Right face of cube -->
    <path d="M82 24 L82 60 L50 76 L50 40 Z" />

    <!-- Ice reflection lines on top -->
    <path d="M35 18 Q40 22 38 28" stroke-width="1.8" opacity="0.7"/>
    <path d="M60 20 Q68 25 65 32" stroke-width="1.8" opacity="0.7"/>

    <!-- Ice reflection lines on left face -->
    <path d="M28 35 Q32 45 30 55" stroke-width="1.8" opacity="0.6"/>

    <!-- Ice reflection lines on right face -->
    <path d="M70 38 Q74 48 72 58" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Sunglasses -->
  <g fill="#3d4f5f">
    <!-- Left lens -->
    <ellipse cx="38" cy="48" rx="12" ry="7" />
    <!-- Right lens -->
    <ellipse cx="62" cy="48" rx="12" ry="7" />
    <!-- Bridge -->
    <rect x="48" y="46" width="4" height="3" rx="1" />
    <!-- Left arm -->
    <path d="M26 47 L18 44" stroke="#3d4f5f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right arm -->
    <path d="M74 47 L82 44" stroke="#3d4f5f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Mouth - slight frown for cool attitude -->
  <path d="M42 62 Q50 58 58 62" stroke="#3d4f5f" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
